name: Weekly ingest

# Scheduled trigger paused 2026-08-10 while the search algorithm (arXiv
# categories, keyword groups, Crossref venues in run.mjs) is still being
# tuned — don't want an unattended Monday run opening a PR mid-iteration.
# Uncomment the schedule block below to resume the weekly automatic run;
# it was Monday 07:00 UTC. workflow_dispatch stays live in the meantime,
# so manual test runs (Actions tab, or `gh workflow run ingest.yml`)
# still work exactly as before.
on:
  # schedule:
  #   - cron: '0 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run pipeline
        run: npm run pipeline:run
        env:
          # Add DEEPSEEK_API_KEY as a repo secret (Settings > Secrets and
          # variables > Actions) before this can extract anything live.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'Weekly ingest: new entries'
          title: 'Weekly ingest — ${{ github.run_id }}'
          body-path: scripts/pipeline/run-summary.md
          branch: ingest/weekly-${{ github.run_number }}
          add-paths: |
            src/content/entries/**
            data/backlog-queue.csv
